{{/*
Test del chart. "helm test <release>" crea este Pod; si termina con exit 0,
el test pasa. La anotación helm.sh/hook=test es lo que lo marca como test.
Verifica que la app responde y que /cache-test funciona (o sea, que la app
llega a Redis con la password del Secret).
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mini-app.fullname" . }}-test-health"
  labels:
    {{- include "mini-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    # before-hook-creation: borra el pod de test anterior justo antes de crear
    # uno nuevo. No usamos "hook-succeeded" para poder ver los logs después
    # (helm test --logs o kubectl logs mini-app-test-health).
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  # curlimages/curl ya corre no-root por defecto (uid 100, gid 101).
  # Sin probes a propósito: es un pod de un solo uso que termina en segundos,
  # no un servicio de larga duración (readiness/liveness no aplican acá).
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  automountServiceAccountToken: false
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      command:
        - sh
        - -c
        - |
          set -e
          base="http://{{ include "mini-app.fullname" . }}:{{ .Values.app.service.port }}"
          echo "GET $base/health";     curl -fsS "$base/health"; echo
          echo "GET $base/cache-test"; curl -fsS "$base/cache-test"; echo
