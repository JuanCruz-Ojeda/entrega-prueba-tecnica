{{/*
Password de Redis. Prioridad:
  1. .Values.redis.auth.password si tiene valor (útil para --set en la demo)
  2. el Secret ya existente en el cluster (lookup) -> se reusa, así la password
     es ESTABLE entre 'helm upgrade' (si no, cada upgrade la rotaría y Redis
     quedaría inaccesible para los pods viejos)
  3. si no existe (primera instalación): se genera aleatoria

Caveat: 'helm template' corre SIN cluster, así que lookup devuelve vacío y en
ese modo se ve una password nueva en cada render. En 'helm install/upgrade'
(que sí hablan con el cluster) el comportamiento es el correcto.
*/}}
{{- $secretName := include "mini-app.redis.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $password := "" -}}
{{- if .Values.redis.auth.password -}}
  {{- $password = .Values.redis.auth.password -}}
{{- else if and $existing $existing.data (hasKey $existing.data "redis-password") -}}
  {{- $password = (index $existing.data "redis-password" | b64dec) -}}
{{- else -}}
  {{- $password = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mini-app.labels" . | nindent 4 }}
type: Opaque
data:
  redis-password: {{ $password | b64enc | quote }}
