{{/*
La app (Flask + gunicorn). Stateless -> Deployment con N réplicas.
Config por variables de entorno:
  - REDIS_HOST / REDIS_PORT  <- ConfigMap (envFrom)
  - REDIS_PASSWORD           <- Secret (mapeo explícito: la clave del Secret
                                 es "redis-password" y la env var "REDIS_PASSWORD")
Probes contra /health (endpoint que ya expone la app).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mini-app.fullname" . }}
  labels:
    {{- include "mini-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "mini-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "mini-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      # Endurecido según lo que encontró Checkov (framework helm) — ver
      # security/README.md. La imagen ya corre no-root (uid 10001, ver
      # app/Dockerfile); esto se lo declara también a Kubernetes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false   # la app no llama a la API de k8s
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: {{ include "mini-app.fullname" . }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mini-app.redis.secretName" . }}
                  key: redis-password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
