name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancelar corridas viejas del mismo ref si llega un push nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos por defecto: solo leer el repo.
permissions:
  contents: read

jobs:
  # ===================================================================
  # Lint + build + smoke test. Corre siempre (push y PRs).
  # ===================================================================
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Lint (ruff)
        run: |
          pip install ruff==0.16.5
          ruff check .

      - name: Build + smoke test (docker compose)
        run: |
          docker compose up -d --build
          ./scripts/smoke-test.sh http://localhost:8080

      - name: Logs de compose (si algo falló)
        if: failure()
        run: docker compose logs

      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  # ===================================================================
  # Publicación de la imagen. Solo en push a main y solo si build-test pasó.
  # Registro: GHCR (ghcr.io), autenticado con el GITHUB_TOKEN que ya provee
  # Actions (sin secrets adicionales).
  #
  # Para desplegar a AWS el camino es análogo: cambiar el login por
  # aws-actions/configure-aws-credentials (OIDC) + aws-actions/amazon-ecr-login,
  # pushear a ECR y disparar "aws ecs update-service --force-new-deployment".
  # El detalle está en infra/README.md.
  # ===================================================================
  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata de la imagen (tags y labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build y push a GHCR
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
